server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Model uploads are multipart and routinely several MB. nginx defaults to 1 MB,
    # which rejected every real upload with a plain 413 HTML page before the request
    # ever reached the API (whose own limit is 120 MiB incl. the multipart envelope).
    # Sized above that so oversized files get the API's JSON `file_too_large` message
    # instead of an nginx error page.
    client_max_body_size 120m;

    # Upstream is templated: docker-compose leaves the default (api:8080), while Railway
    # injects its private address (e.g. http://printgrid-api.railway.internal:8080).
    # nginx's entrypoint envsubst only replaces variables that exist in the environment,
    # so $host / $uri below are left untouched.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        # Stream large multipart bodies to ASP.NET as they arrive. Without this,
        # nginx first writes the entire upload to its temporary storage, making
        # large model uploads appear stalled before the API starts receiving it.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
